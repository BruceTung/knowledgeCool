<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知源 KnowledgeCool · 交互原型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#F7F7F5;--bg3:#F1EFE8;--bg4:#E8E7E2;
  --tx:#2C2C2A;--tx2:#5F5E5A;--tx3:#94918A;
  --bd:rgba(0,0,0,.10);--bd2:rgba(0,0,0,.22);
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-tx:#0C447C;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-tx:#085041;
  --amber:#854F0B;--amber-bg:#FAEEDA;--amber-tx:#633806;
  --purple:#534AB7;--purple-bg:#EEEDFE;--purple-tx:#3C3489;
  --pink:#993556;--pink-bg:#FBEAF0;
  --red:#A32D2D;--red-bg:#FCEBEB;--green:#3B6D11;--green-bg:#EAF3DE;
  --r:8px;--r2:12px;--r3:16px;
  --sh:0 8px 28px rgba(0,0,0,.10);--sh2:0 2px 8px rgba(0,0,0,.06);
}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.6;color:var(--tx);background:var(--bg2);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd2);border-radius:var(--r);padding:6px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}
code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12px;background:var(--bg3);padding:1px 5px;border-radius:5px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--bd2);border-radius:var(--r);font-size:12px;background:var(--bg);white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--bg3)}
.btn.p{background:var(--tx);color:#fff;border-color:var(--tx)}
.btn.p:hover{background:#000}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--bg3)}
.ic{width:16px;height:16px;display:block;flex:0 0 auto}
.av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex:0 0 auto}
.av.lg{width:28px;height:28px;font-size:12px}
.av.xl{width:36px;height:36px;font-size:14px}
.av.amber{background:var(--amber-bg);color:var(--amber-tx)}
.av.teal{background:var(--teal-bg);color:var(--teal-tx)}
.av.purple{background:var(--purple-bg);color:var(--purple-tx)}
.av.pink{background:var(--pink-bg);color:var(--pink)}
.av.blue{background:var(--blue-bg);color:var(--blue-tx)}
.av.gray{background:var(--bg4);color:var(--tx2)}
.tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:20px;font-size:11px;white-space:nowrap}
.tag.blue{background:var(--blue-bg);color:var(--blue-tx)}
.tag.teal{background:var(--teal-bg);color:var(--teal-tx)}
.tag.amber{background:var(--amber-bg);color:var(--amber-tx)}
.tag.purple{background:var(--purple-bg);color:var(--purple-tx)}
.tag.pink{background:var(--pink-bg);color:var(--pink)}
.tag.gray{background:var(--bg4);color:var(--tx2)}
.tag.green{background:var(--green-bg);color:var(--green)}
.hint{font-size:11px;color:var(--tx3)}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg3);z-index:50}
#login .card{width:380px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r3);padding:32px;box-shadow:var(--sh)}
#login .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
#login .brand .logo{width:32px;height:32px;border-radius:9px;background:var(--blue-bg);color:var(--blue-tx);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;border:1px solid var(--blue)}
#login h1{font-size:17px;font-weight:500}
#login .field{margin-top:16px}
#login label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
#login .btn.p{width:100%;justify-content:center;margin-top:22px;padding:8px}
#login .foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--bd);font-size:11px;color:var(--tx3);line-height:1.7}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;height:100vh;background:var(--bg)}
.topbar{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--bd);background:var(--bg)}
.body{flex:1;display:flex;min-height:0}
.rail{width:50px;flex:0 0 50px;border-right:1px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:4px}
.rail .ritem{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:background .12s;position:relative}
.rail .ritem:hover{background:var(--bg4);color:var(--tx)}
.rail .ritem.on{background:var(--bg);color:var(--tx);box-shadow:var(--sh2)}
.rail .sp{margin-top:auto}
.rail .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg2)}
.tree{width:252px;flex:0 0 252px;border-right:1px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.tree .thead{display:flex;align-items:center;gap:6px;padding:10px 10px 8px 12px}
.tree .spacesel{flex:1;display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:var(--r);transition:background .12s}
.tree .spacesel:hover{background:var(--bg4)}
.tree .tbody{flex:1;overflow:auto;padding:0 8px 16px}
.trow{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:6px;cursor:pointer;user-select:none;position:relative;border:1px solid transparent}
.trow:hover{background:var(--bg4)}
.trow.on{background:var(--bg);border-color:var(--bd);font-weight:500}
.trow .che{width:14px;flex:0 0 14px;text-align:center;font-size:9px;color:var(--tx3);transition:transform .12s}
.trow .che.open{transform:rotate(90deg)}
.trow .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.trow .acts{display:none;gap:1px}
.trow:hover .acts{display:flex}
.trow .acts button{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--tx3)}
.trow .acts button:hover{background:var(--bg2);color:var(--tx)}
.trow.drag{opacity:.35}
.trow.drop-before{box-shadow:inset 0 2px 0 var(--blue)}
.trow.drop-after{box-shadow:inset 0 -2px 0 var(--blue)}
.trow.drop-into{background:var(--blue-bg);border-color:var(--blue)}
.tfree{padding:6px 8px;font-size:11px;color:var(--tx3)}
.main{flex:1;min-width:0;overflow:auto;background:var(--bg)}
.context{width:248px;flex:0 0 248px;border-left:1px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
body.v-nodoc .context{display:none}

/* ---------- editor ---------- */
.docwrap{max-width:760px;margin:0 auto;padding:26px 40px 120px;position:relative}
.crumb{font-size:11px;color:var(--tx3);margin-bottom:8px}
.crumb b{font-weight:400;cursor:pointer}
.crumb b:hover{color:var(--tx2)}
.doctitle{font-size:24px;font-weight:500;line-height:1.35;outline:none;margin-bottom:8px}
.docmeta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx3);flex-wrap:wrap}
.toolbar{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:8px 40px;background:var(--bg);border-bottom:1px solid var(--bd)}
.tb{height:26px;min-width:26px;padding:0 6px;border-radius:6px;font-size:11.5px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.tb:hover{background:var(--bg3);color:var(--tx)}
.tb.sep{width:1px;min-width:1px;background:var(--bd);margin:0 5px;padding:0}
.editor{outline:none;font-size:14px;line-height:1.85;min-height:340px}
.editor:empty:before{content:"在这里开始写…";color:var(--tx3)}
.editor h2{font-size:17px;font-weight:500;margin:26px 0 8px}
.editor h3{font-size:15px;font-weight:500;margin:20px 0 6px}
.editor p{margin:0 0 12px}
.editor ul,.editor ol{margin:0 0 12px 22px}
.editor li{margin-bottom:5px}
.editor blockquote{border-left:2px solid var(--amber);background:var(--amber-bg);color:var(--amber-tx);padding:9px 14px;border-radius:0 8px 8px 0;margin:0 0 14px;font-size:13px}
.editor pre{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.7;overflow:auto;margin:0 0 14px}
.editor a{color:var(--blue);text-decoration:underline}
.editor table{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:13px}
.editor th,.editor td{border:1px solid var(--bd);padding:6px 10px;text-align:left}
.editor th{background:var(--bg3);font-weight:500}
.emark{background:var(--amber-bg);border-bottom:1px dotted var(--amber);cursor:pointer}
.rc{position:absolute;width:2px;background:#D85A30;transition:top .7s ease,left .7s ease;pointer-events:none;z-index:9}
.rc .nm{position:absolute;top:-17px;left:0;background:#D85A30;color:#fff;font-size:11px;line-height:1.35;padding:1px 6px;border-radius:4px;white-space:nowrap}
.rc.t2{background:#1D9E75}
.rc.t2 .nm{background:#1D9E75}
.livetip{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tx);color:#fff;font-size:12px;padding:7px 14px;border-radius:20px;box-shadow:var(--sh);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.livetip.on{opacity:1}

/* ---------- context panel ---------- */
.ctabs{display:flex;gap:2px;padding:9px 10px;border-bottom:1px solid var(--bd)}
.ctab{padding:4px 9px;border-radius:6px;font-size:12px;color:var(--tx2)}
.ctab:hover{background:var(--bg4)}
.ctab.on{background:var(--bg);color:var(--tx);font-weight:500;box-shadow:var(--sh2)}
.cbody{flex:1;overflow:auto;padding:12px 12px 24px}
.tocitem{display:block;padding:4px 8px;border-radius:6px;font-size:12px;color:var(--tx2);cursor:pointer}
.tocitem:hover{background:var(--bg4);color:var(--tx)}
.tocitem.lv2{padding-left:18px;font-size:12px}
.tocitem.on{color:var(--tx);font-weight:500;background:var(--bg)}
.cmt{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r2);padding:10px 12px;margin-bottom:10px}
.cmt .hd{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.cmt .hd .t{margin-left:auto;font-size:11px;color:var(--tx3)}
.cmt p{font-size:12.5px;color:var(--tx)}
.cmt .rp{margin-top:9px;padding-top:9px;border-top:1px solid var(--bd);font-size:11px;color:var(--tx3);cursor:pointer}
.cmt .rp:hover{color:var(--blue)}
.ver{display:flex;gap:9px;padding:9px 8px;border-radius:var(--r);cursor:pointer;border:1px solid transparent}
.ver:hover{background:var(--bg4)}
.ver.on{background:var(--bg);border-color:var(--bd)}
.ver .v{font-size:12.5px;font-weight:500}
.ver .m{font-size:11px;color:var(--tx3)}

/* ---------- generic pages ---------- */
.page{max-width:1020px;margin:0 auto;padding:26px 34px 90px}
.page>h1{font-size:19px;font-weight:500;margin-bottom:4px}
.page>.sub{font-size:12.5px;color:var(--tx2);margin-bottom:20px}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;margin-bottom:16px}
.card>h2{font-size:13.5px;font-weight:500;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--bg2);display:flex;align-items:center;gap:8px}
.card>h2 .r{margin-left:auto;font-weight:400}
.card .in{padding:14px 16px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:9px 16px;text-align:left;border-bottom:1px solid var(--bd)}
table.t th{font-size:11.5px;color:var(--tx3);font-weight:400;background:var(--bg2)}
table.t tr:last-child td{border-bottom:none}
table.t tr:hover td{background:var(--bg2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.mcard{border:1px solid var(--bd);border-radius:var(--r2);padding:16px;background:var(--bg)}
.mcard h3{font-size:13px;font-weight:500;margin-bottom:3px}
.mcard .d{font-size:11.5px;color:var(--tx3);margin-bottom:12px}
.mcard ul{margin-left:16px;font-size:12.5px;color:var(--tx2)}
.mcard li{margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--bd2);border-radius:20px;font-size:11.5px;color:var(--tx2);background:var(--bg)}
pre.code{background:#2C2C2A;color:#EDEDE8;border-radius:var(--r2);padding:16px 18px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.75;overflow:auto;white-space:pre}
pre.code .k{color:#C0DD97}
pre.code .c{color:#94918A}
pre.code .s{color:#FAC775}
pre.code .f{color:#85B7EB}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.flow .n{padding:6px 12px;border-radius:20px;border:1px solid var(--bd2);background:var(--bg);white-space:nowrap}
.flow .n.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-tx)}
.flow .a{color:var(--tx3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12.5px}
.kv .k{color:var(--tx3)}
.notice{border-left:2px solid var(--teal);background:var(--teal-bg);color:var(--teal-tx);padding:10px 14px;border-radius:0 8px 8px 0;font-size:12.5px;margin-bottom:12px}
.notice.warn{border-color:var(--amber);background:var(--amber-bg);color:var(--amber-tx)}
.notice.dang{border-color:var(--red);background:var(--red-bg);color:var(--red)}

/* ---------- overlays ---------- */
#modal-root{position:fixed;inset:0;z-index:40;display:none}
#modal-root.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:520px;max-width:calc(100vw - 40px);max-height:84vh;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r3);box-shadow:var(--sh)}
.modal .mh{display:flex;align-items:center;gap:9px;padding:15px 20px;border-bottom:1px solid var(--bd)}
.modal .mh h2{font-size:14px;font-weight:500;flex:1}
.modal .mb{padding:16px 20px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--bd);background:var(--bg2);border-radius:0 0 var(--r3) var(--r3)}
.field{margin-bottom:15px}
.field>label{display:block;font-size:12px;color:var(--tx2);margin-bottom:6px}
.row{display:flex;align-items:center;gap:9px}
.sw{width:34px;height:19px;border-radius:20px;background:var(--bg4);position:relative;transition:background .15s;flex:0 0 auto;cursor:pointer}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:var(--sh2);transition:left .15s}
.sw.on{background:var(--teal)}
.sw.on:after{left:17px}
.rulerow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--bd)}
.rulerow:last-child{border-bottom:none}
.rulerow .g{flex:1;min-width:0}
.rulerow .g .n{font-size:12.5px}
.rulerow .g .s{font-size:11px;color:var(--tx3)}
.pop{position:fixed;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r2);box-shadow:var(--sh);z-index:45;overflow:hidden}
.pop .ph{padding:11px 14px;border-bottom:1px solid var(--bd);font-size:12px;font-weight:500;display:flex;align-items:center}
.pop .pi{padding:10px 14px;border-bottom:1px solid var(--bd);display:flex;gap:9px}
.pop .pi:last-child{border-bottom:none}
.pop .pi:hover{background:var(--bg2)}
.pop .pi .x{flex:1;min-width:0}
.pop .pi .n{font-size:12.5px}
.pop .pi .d{font-size:11.5px;color:var(--tx3)}
.pop .mi{padding:7px 13px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pop .mi:hover{background:var(--bg3)}
#cmdk{position:fixed;inset:0;z-index:55;display:none}
#cmdk.on{display:block}
#cmdk .scrim{background:rgba(0,0,0,.20)}
.cmdbox{position:absolute;top:14vh;left:50%;transform:translateX(-50%);width:560px;max-width:calc(100vw - 40px);background:var(--bg);border:1px solid var(--bd);border-radius:var(--r3);box-shadow:var(--sh);overflow:hidden}
.cmdbox input{border:none;border-bottom:1px solid var(--bd);border-radius:0;padding:15px 18px;font-size:14px}
.cmdbox input:focus{box-shadow:none;border-color:var(--bd)}
.cmdlist{max-height:52vh;overflow:auto;padding:8px}
.cmdi{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r);cursor:pointer}
.cmdi:hover,.cmdi.on{background:var(--bg3)}
.cmdi .x{flex:1;min-width:0}
.cmdi .n{font-size:12.5px}
.cmdi .p{font-size:11px;color:var(--tx3)}
.empt{padding:28px;text-align:center;color:var(--tx3);font-size:12.5px}

/* ---------- responsive ---------- */
@media(max-width:1180px){.context{display:none}}
@media(max-width:900px){.tree{display:none}.docwrap{padding:22px}.toolbar{padding:8px 22px}.page{padding:20px}}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="brand">
      <div class="logo">知</div>
      <div>
        <h1>知源知识库</h1>
        <div class="hint">KnowledgeCool · 内网部署</div>
      </div>
    </div>
    <div class="field">
      <label>企业邮箱</label>
      <input id="lg-mail" value="lin@corp.cn" autocomplete="off">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="lg-pwd" type="password" value="prototype" autocomplete="off">
    </div>
    <button class="btn p" data-act="login">登录</button>
    <div class="foot">
      首次部署时,数据库为空,系统会引导你创建第一个管理员账号。<br>
      SSO / 企业微信登录属于阶段三范围,本期未实现。
    </div>
  </div>
</div>

<div id="app" class="shell" style="display:none">
  <header id="topbar" class="topbar"></header>
  <div class="body">
    <aside id="rail" class="rail"></aside>
    <aside id="tree" class="tree"></aside>
    <main id="main" class="main"></main>
    <aside id="context" class="context"></aside>
  </div>
</div>

<div id="modal-root"></div>
<div id="cmdk"></div>
<div id="tip" class="livetip"></div>

<script>
"use strict";

/* ============ 数据层(原型用内存数据,对应阶段一真实的 PG 表) ============ */
var ROLE = {owner:"所有者",admin:"空间管理员",editor:"编辑者",commenter:"评论者",viewer:"只读成员",none:"无权限"};

var spaces = [
  {id:"rd",name:"研发中心",letter:"研",color:"blue"},
  {id:"mk",name:"市场部空间",letter:"市",color:"amber"}
];

var pages = [
  {id:"p-product",space:"rd",parent:null,title:"产品文档"},
  {id:"p-req",space:"rd",parent:"p-product",title:"需求规格说明书",cmt:2},
  {id:"p-iter",space:"rd",parent:"p-product",title:"版本迭代记录"},
  {id:"p-tech",space:"rd",parent:null,title:"技术方案"},
  {id:"p-api",space:"rd",parent:"p-tech",title:"接口设计约定"},
  {id:"p-onboard",space:"rd",parent:null,title:"新人手册"},
  {id:"p-meeting",space:"rd",parent:null,title:"会议纪要"},
  {id:"p-mk1",space:"mk",parent:null,title:"品牌视觉规范"}
];

var trash = [
  {id:"t1",space:"rd",title:"旧版接口文档",by:"林晓",at:"2026-09-24 15:20"},
  {id:"t2",space:"rd",title:"废弃需求草稿",by:"陈默",at:"2026-09-21 09:05"}
];

/* ============ 工具 ============ */
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function byId(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}
function page(id){return byId(pages,id);}
function user(id){return byId(members,id);}
function userName(id){var u=user(id);return u?u.name:id;}
function userColor(id){var u=user(id);return u?u.color:"gray";}
function kids(space,parent){return pages.filter(function(p){return p.space===space&&p.parent===parent;});}
function spaceName(id){var s=byId(spaces,id);return s?s.name:"-";}
function pathOf(id){
  var out=[],p=page(id),guard=0;
  while(p&&guard++<20){out.unshift(p);p=p.parent?page(p.parent):null;}
  return out;
}
function tip(t){
  var e=$("#tip");e.textContent=t;e.classList.add("on");
  clearTimeout(tip._t);tip._t=setTimeout(function(){e.classList.remove("on");},1600);
}

function treeRows(space,parent,depth){
  var list=kids(space,parent);
  return list.map(function(p){
    var has=kids(space,p.id).length>0;
    var open=!S.collapsed[p.id];
    var arrow = has ? '<span class="che'+(open?" open":"")+'" data-act="fold" data-id="'+p.id+'">&#9654;</span>' : '<span class="che"></span>';
    var html='<div class="trow'+(p.id===S.pageId?" on":"")+'" draggable="true" data-id="'+p.id+'" data-act="open" style="padding-left:'+(6+depth*13)+'px">'
      + arrow
      + '<span class="ttl">'+esc(p.title)+'</span>'
      + (p.cmt?'<span class="tag pink" style="font-size:10px;padding:0 5px">'+p.cmt+'</span>':"")
      + '<span class="acts">'
        + '<button data-act="add" data-id="'+p.id+'" title="新建子页面">+</button>'
        + '<button data-act="del" data-id="'+p.id+'" title="移到回收站">×</button>'
      + '</span></div>';
    if(has&&open){html+=treeRows(space,p.id,depth+1);}
    return html;
  }).join("");
}

  if(cmd||blk){
    e.preventDefault();
    if(blk){
      var map={h2:"H2",h3:"H3",p:"P",blockquote:"BLOCKQUOTE",pre:"PRE"};
      document.execCommand("formatBlock",false,map[blk]);
    }else if(cmd==="createLink"){

      S.collapsed[fid]=!S.collapsed[fid];
      renderTree();renderPop();break;
    case "add":
      var pid=t.getAttribute("data-id")||null;
      var title=prompt("新页面标题","未命名页面");

        var nid="p"+Date.now();
        pages.push({id:nid,space:S.space,parent:pid,title:title});
        docContent[nid]={title:title,body:"<p>新页面,开始写吧。</p>"};

        S.pageId=nid;S.view="doc";

      }
      render();break;

      if(dp){trash.push({id:"t"+Date.now(),space:dp.space,title:dp.title,by:"林晓",at:"刚刚"});}

      tip("已恢复,子页面一并恢复");
      render();break;
    case "purge":

      break;

    case "modal":

    case "close-modal":

      var box=el.getBoundingClientRect(),wrap=w.getBoundingClientRect();
      var top=box.top-wrap.top+Math.random()*Math.max(12,box.height-10);
      var left=Math.min(box.width-4,60+Math.random()*Math.max(20,box.width-70));
      tag.style.top=top+"px";tag.style.left=left+"px";
    }
    place(lines[Math.floor(Math.random()*lines.length)],r1);
    place(lines[Math.floor(Math.random()*lines.length)],r2);
  };
  tick();
  collabTimer=setInterval(tick,1800);
}

/* ---------- 拖拽排序 ---------- */
var dragId=null,dropInfo=null;
document.addEventListener("dragstart",function(e){
  var row=e.target.closest&&e.target.closest(".trow");
  if(!row)return;
  dragId=row.getAttribute("data-id");
  row.classList.add("drag");
  e.dataTransfer.effectAllowed="move";
  try{e.dataTransfer.setData("text/plain",dragId);}catch(err){}
});
document.addEventListener("dragover",function(e){
  var row=e.target.closest&&e.target.closest(".trow");
  if(!row||!dragId)return;
  var id=row.getAttribute("data-id");
  if(id===dragId)return;
  e.preventDefault();
  var box=row.getBoundingClientRect(),y=(e.clientY-box.top)/box.height;
  var zone=y<0.28?"before":(y>0.72?"after":"into");
  Array.prototype.forEach.call(document.querySelectorAll(".trow"),function(r){
    r.classList.remove("drop-before","drop-after","drop-into");
  });
  row.classList.add("drop-"+zone);
  dropInfo={target:id,zone:zone};
});
document.addEventListener("dragend",function(){
  Array.prototype.forEach.call(document.querySelectorAll(".trow"),function(r){
    r.classList.remove("drop-before","drop-after","drop-into","drag");
  });
  dragId=null;dropInfo=null;
});
document.addEventListener("drop",function(e){
  e.preventDefault();
  if(!dragId||!dropInfo){dragId=null;dropInfo=null;return;}
  var src=page(dragId),tgt=page(dropInfo.target);
  if(src&&tgt&&src.id!==tgt.id){
    if(dropInfo.zone==="into"){
      if(src.parent===tgt.id){tip("不能移动到自己的子级");}
      else if(!isDescendant(tgt.id,src.id)){
        src.parent=tgt.id;S.collapsed[tgt.id]=false;
        pages=pages.filter(function(p){return p.id!==src.id;});
        var idx=pages.indexOf(tgt);pages.splice(idx+1,0,src);
        tip("已移动到「"+tgt.title+"」下,服务端会重建子树 materialized_path");
      }else{tip("不能移动到自己的子级");}
    }else{
      src.parent=tgt.parent;
      pages=pages.filter(function(p){return p.id!==src.id;});
      var ti=pages.indexOf(tgt);
      pages.splice(dropInfo.zone==="before"?ti:ti+1,0,src);
      tip("已调整同级顺序,写入 position 字段");
    }
  }
  Array.prototype.forEach.call(document.querySelectorAll(".trow"),function(r){
    r.classList.remove("drop-before","drop-after","drop-into","drag");
  });
  dragId=null;dropInfo=null;
  render();
});
function isDescendant(candidate,ancestorId){
  var p=page(candidate),g=0;
  while(p&&g++<20){if(p.parent===ancestorId)return true;p=p.parent?page(p.parent):null;}
  return false;
}

/* ---------- 启动 ---------- */
/* 支持免登录直达,便于演示与截图:
   index.html?demo                     直接进入工作台
   index.html?demo&v=spec              直接看「阶段一逻辑」
   index.html?demo&v=members           成员与角色
   index.html?demo&v=trash             回收站
   index.html?demo&page=p-tech         直接打开某个页面
   index.html?demo&tab=comments        右栏切到评论 */
(function boot(){
  var q=location.search;
  if(q.indexOf("demo")<0)return;
  S.authed=true;
  var m=q.match(/[?&]v=([a-z]+)/);
  if(m&&["doc","members","trash","spec"].indexOf(m[1])>=0)S.view=m[1];
  var p=q.match(/[?&]page=([A-Za-z0-9_-]+)/);
  if(p&&page(p[1])){S.pageId=p[1];S.space=page(p[1]).space;}
  var c=q.match(/[?&]tab=([a-z]+)/);
  if(c&&["toc","comments","versions"].indexOf(c[1])>=0)S.ctxTab=c[1];
})();

document.body.addEventListener("click",function(e){
  if(S.pop){
    var inside=e.target.closest(".pop")||e.target.closest("[data-act='pop']");
    if(!inside){S.pop=null;renderPop();}
  }
},true);

render();
</script>
