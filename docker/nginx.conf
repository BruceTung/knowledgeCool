# ============================================================
# 知源 KnowledgeCool · Nginx 站点配置
# 职责(DESIGN.md §3.2):只做静态资源 + 反向代理,**不做任何权限判断**。
# ============================================================

# WebSocket 升级头。阶段二的协同网关要用;现在先配好,
# 否则到时候会出现"HTTP 接口正常但 WS 一直握手失败"这种难查的问题。
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 关闭版本号回显
  server_tokens off;

  # 附件上传(M4 起支持粘贴图片)。默认 1m 太小。
  client_max_body_size 20m;

  # 带指纹的静态资源可以长缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # --------------------------------------------------------------
  # 附件(图片)直出,不经过 Node
  #
  # 目录由 docker-compose 把 api 的 uploads 卷以只读挂进来 ——
  # 图片是静态字节流,让 Nest 转发纯属浪费一个进程的时间片。
  #
  # ⚠️ 两道加固:
  #   1. `types {}` 把可服务的 Content-Type 限死成图片。即使将来白名单被放宽,
  #      也不会有内容被当成 HTML/JS 执行(那是最典型的存储型 XSS)。
  #   2. `default_type application/octet-stream` 让未知扩展名只能被下载、不能被解析。
  # --------------------------------------------------------------
  location /uploads/ {
    alias /data/uploads/;

    types {
      image/png  png;
      image/jpeg jpg jpeg;
      image/gif  gif;
      image/webp webp;
      image/avif avif;
    }
    default_type application/octet-stream;

    # 文件名是服务端生成的 UUID,内容不会变 —— 可以放心长缓存
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff";

    # 不允许列目录
    autoindex off;
  }

  # API 反向代理。注意 proxy_pass 结尾**不带路径**,
  # 这样原始 URI(/api/v1/...) 会原样透传 —— 与 API 的全局前缀一致。
  location /api/ {
    proxy_pass http://api:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 会话走 HttpOnly Cookie,必须允许凭证相关的头透传
    proxy_set_header Cookie $http_cookie;

    # 阶段二协同用同一域名下的 WebSocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # 健康检查直通,便于外部探针不经过 SPA 回退逻辑
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # SPA 前端路由回退:找不到的路径交给 index.html,
  # 否则刷新 /s/:spaceId/p/:pageId 会 404。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
